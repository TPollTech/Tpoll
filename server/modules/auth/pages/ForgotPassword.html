<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha — TPoll Tech</title>
    <link rel="icon" type="image/png" href="TPoll%20Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', Arial, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; flex-direction: column; }
        a { color: #00BDAE; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .auth-header { background: #1a1a2e; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
        .auth-header img { height: 36px; }
        .auth-header span { color: #fff; font-weight: 700; font-size: 18px; letter-spacing: .5px; }

        .auth-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }

        .auth-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,.08);
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
        }
        .auth-card h1 { font-size: 22px; color: #1a1a2e; margin-bottom: 6px; }
        .auth-card .subtitle { font-size: 14px; color: #777; margin-bottom: 28px; line-height: 1.5; }

        .field { margin-bottom: 22px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
        .field input {
            width: 100%; padding: 11px 14px; border: 1.5px solid #d1d5db; border-radius: 8px;
            font-size: 15px; font-family: inherit; transition: border-color .2s; outline: none;
        }
        .field input:focus { border-color: #00BDAE; }

        .btn-primary {
            width: 100%; padding: 13px; background: #00BDAE; color: #fff;
            border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: background .2s;
        }
        .btn-primary:hover { background: #009d90; }
        .btn-primary:disabled { background: #a0e0da; cursor: default; }

        .link-row { text-align: center; font-size: 14px; color: #555; margin-top: 20px; }

        .alert { display: none; padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 18px; line-height: 1.5; }
        .alert-error   { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    </style>
</head>
<body>
    <header class="auth-header">
        <a href="index.html"><img src="TPoll%20Logo.png" alt="TPoll Logo"></a>
        <span>TPoll Tech</span>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <h1>Esqueci minha senha</h1>
            <p class="subtitle">Informe seu e-mail cadastrado e enviaremos um link para redefinir sua senha.</p>

            <div id="alertBox" class="alert"></div>

            <form id="forgotForm" novalidate>
                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">Enviar link</button>
            </form>

            <p class="link-row"><a href="/login">← Voltar para o login</a></p>
        </div>
    </main>

    <script>
        const form      = document.getElementById('forgotForm');
        const alertBox  = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');
        const API_BASE  = window.TPOLL_AUTH_API_BASE || '';
        const isGithubPages = location.hostname.includes('github.io');

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = 'block';
        }

        function apiUrl(path) {
            return `${API_BASE}${path}`;
        }

        async function parseJsonSafe(response) {
            const contentType = (response.headers.get('content-type') || '').toLowerCase();
            if (contentType.includes('application/json')) return response.json();
            const text = await response.text();
            if (/<!doctype html|<html/i.test(text)) {
                throw new Error('API_UNAVAILABLE');
            }
            return { message: text || 'Resposta inválida do servidor.' };
        }

        function showBackendUnavailable() {
            if (isGithubPages) {
                showAlert('Recuperação de senha indisponível no GitHub Pages sem backend. Abra pelo servidor Node local (http://127.0.0.1:5500/esqueci-minha-senha) ou configure TPOLL_AUTH_API_BASE.', 'error');
                return;
            }
            showAlert('Servidor de autenticação indisponível no momento. Tente novamente em instantes.', 'error');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando…';

            try {
                const response = await fetch(apiUrl('/auth/forgot-password'), {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ email: document.getElementById('email').value.trim() })
                });
                const data = await parseJsonSafe(response);
                showAlert(data.message || 'Se este e-mail estiver cadastrado, enviaremos um link para redefinir sua senha.', 'success');
                form.reset();
            } catch (error) {
                if (String(error && error.message) === 'API_UNAVAILABLE') {
                    showBackendUnavailable();
                } else {
                    showAlert('Se este e-mail estiver cadastrado, enviaremos um link para redefinir sua senha.', 'success');
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Enviar link';
            }
        });
    </script>
</body>
</html>
